<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
  :root{

  .screen .center{position:absolute;left:50%;top:50%;width:0;height:0;margin:-13px 0 0 -9px;transform-origin:9px 13px;

  .blip{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--coral);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);transition:left 1.2s ease,top 1.2s ease}

  .label{position:absolute;font-size:10px;font-weight:700;color:#fff;white-space:nowrap;transform:translate(-50%,10px);pointer-events:none;background:rgba(23,58,69,.75);padding:1px 5px;border-radius:6px}
  .label.found{color:#ffe7a8}
  .screen-text{position:absolute;left:0;right:0;text-align:center;font-size:11px;color:var(--sea-deep);font-weight:700;letter-spacing:.1em;pointer-events:none;text-shadow:0 0 4px #fff,0 0 4px #fff}
  .screen-text.top{top:12px}
  .screen-text.bottom{bottom:12px}

  .controls{display:flex;gap:8px;margin-top:14px;align-items:center}
  .range{display:flex;align-items:center;gap:8px;background:var(--sea-pale);border-radius:14px;padding:6px 12px;flex:1}
  .rlab{font-size:11px;color:var(--sea-deep);font-weight:700;flex:none}

  input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--coral);box-shadow:0 2px 6px rgba(0,0,0,.2)}

<div class="wrap">

  <p class="foot">按「找到了」後那尊會從雷達和偵測中移除（名單裡可再按一次取消）。找到的紀錄存在網址裡：把網址加入書籤或分享給同行的人，就能延續進度。座標取自 Google 地圖上各尊的地標，守護君每年可能調動，以現場為準。守護君通常站在交叉路口，停車拍照請注意安全。<br>地圖資料 © OpenStreetMap contributors，圖磚 OpenFreeMap</p>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script>
/* ===== 資料：需要校正座標就改這裡 ===== */
const STATUES = [ // 座標取自 Google 地圖上各尊的地標
  {id:1, name:"守護君", jp:"まもる君", place:"宮古島警察署 正門", lat:24.79147, lng:125.29519},

  {id:8, name:"出君", jp:"いずる君", place:"上野新里", lat:24.72963, lng:125.33898},
  {id:9, name:"和樹君", jp:"かずき君", place:"下地小學校前", lat:24.74602, lng:125.28310},
  {id:10, name:"哲也君", jp:"てつや君", place:"與那霸（來間大橋前）", lat:24.73372, lng:125.27514},
  {id:11, name:"正勝君", jp:"まさかつ君", place:"西城小學校附近路口", lat:24.75661, lng:125.36237},
  {id:12, name:"清君", jp:"きよし君", place:"伊良部 仲地", lat:24.81942, lng:125.17881},
  {id:13, name:"淳君", jp:"あつし君", place:"上野小學校前", lat:24.74268, lng:125.33185},
  {id:14, name:"拓真君", jp:"たくま君", place:"宮古電水前（市區）", lat:24.79046, lng:125.28083},
  {id:15, name:"淳樹君", jp:"じゅんき君", place:"伊良部 前里添", lat:24.82792, lng:125.19437, approx:true},
  {id:16, name:"貴也君", jp:"たかや君", place:"池間島 鰹魚公園前", lat:24.92573, lng:125.24591},
  {id:17, name:"勲君", jp:"いさお君", place:"城邊砂川 大路口", lat:24.75886, lng:125.33421},
  {id:18, name:"至君", jp:"いたる君", place:"宮古機場 入境大廳", lat:24.77961, lng:125.29773},
  {id:19, name:"光男君", jp:"みつお君", place:"平良交番前", lat:24.80600, lng:125.28067},
  {id:20, name:"剛君", jp:"つよし君", place:"多良間島 機場前", lat:24.65491, lng:124.67820},
  {id:21, name:"丸子醬", jp:"まる子ちゃん", place:"宮古島警察署 正門", lat:24.79146, lng:125.29521},
];
const ALERT_M = 300;   // 進入幾公尺內就提示
const ISLAND = {lat:24.79, lng:125.29};

/* ===== 道路底圖：OpenFreeMap 向量圖磚（免金鑰），只畫海、陸地、道路，沒有任何文字 =====
   顏色要改就改這幾個 */
const MAPC={ land:'#ffffff', sea:'#cfe9ee', major:'#0d6f8c', minor:'#8fc3cf' };
let map=null, mapReady=false;
try{
  map=new maplibregl.Map({
    container:'map', attributionControl:false, interactive:false, fadeDuration:0,
    center:[ISLAND.lng,ISLAND.lat], zoom:12,
    style:{
      version:8,
      sources:{ omt:{ type:'vector', url:'https://tiles.openfreemap.org/planet' } },
      layers:[
        { id:'bg', type:'background', paint:{ 'background-color':MAPC.land } },
        { id:'water', type:'fill', source:'omt', 'source-layer':'water', paint:{ 'fill-color':MAPC.sea } },
        { id:'road-minor', type:'line', source:'omt', 'source-layer':'transportation',
          filter:['in','class','tertiary','minor','service','residential','unclassified'],
          layout:{ 'line-cap':'round','line-join':'round' },
          paint:{ 'line-color':MAPC.minor, 'line-width':['interpolate',['linear'],['zoom'],11,.4,14,1.4,17,3.5] } },
        { id:'road-major', type:'line', source:'omt', 'source-layer':'transportation',
          filter:['in','class','motorway','trunk','primary','secondary'],
          layout:{ 'line-cap':'round','line-join':'round' },
          paint:{ 'line-color':MAPC.major, 'line-width':['interpolate',['linear'],['zoom'],10,1,14,3.5,17,8] } }
      ]
    }
  });
  map.on('load',()=>{ mapReady=true; fitMap(); render(); });
}catch(e){ map=null; }
function zoomFor(km,lat,radPx){ // 讓範圍圈剛好對到雷達邊緣（MapLibre 512px 圖磚）
  return Math.log2(40075016.686*Math.cos(lat*Math.PI/180)*radPx/(km*1000*512));
}
function fitMap(){
  if(!map) return;
  const c=me||ISLAND, size=document.getElementById('screen').clientWidth, rad=size/2-14;
  map.resize();
  map.jumpTo({center:[c.lng,c.lat], zoom:zoomFor(rangeKm,c.lat,rad)});
}

/* ===== 狀態 ===== */
let rangeKm = 3, watching = null, me = null, lastRender = 0;
let found = new Set(), alerted = new Set(), beepTimer = null;

/* 紀錄同時存在網址（可分享）和手機本機（重新整理、加到主畫面都還在）
   有網址參數以網址為準，否則讀本機 */
const STORE_KEY='mamoru-found';
(function loadFound(){
  const parse=v=>String(v||'').split(',').forEach(s=>{const n=+s; if(n>=1&&n<=21) found.add(n);});
  const m=location.hash.match(/found=([0-9,]+)/);
  if(m) parse(m[1]);
  else { try{ parse(localStorage.getItem(STORE_KEY)); }catch(e){} }
})();
function saveHash(){
  const v=[...found].sort((a,b)=>a-b).join(',');
  try{ history.replaceState(null,'', v?('#found='+v):location.pathname); }catch(e){}
  try{ localStorage.setItem(STORE_KEY,v); }catch(e){}
  document.getElementById('foundCount').textContent=found.size;
}

/* ===== 幾何 ===== */
function distM(a,b){
  const R=6371000,toR=x=>x*Math.PI/180;
  const dLat=toR(b.lat-a.lat), dLng=toR(b.lng-a.lng);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function bearing(a,b){
  const toR=x=>x*Math.PI/180;
  const y=Math.sin(toR(b.lng-a.lng))*Math.cos(toR(b.lat));
  const x=Math.cos(toR(a.lat))*Math.sin(toR(b.lat))-Math.sin(toR(a.lat))*Math.cos(toR(b.lat))*Math.cos(toR(b.lng-a.lng));
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
const fmt=m=> m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(m<10000?1:0)+' km';

/* ===== 聲音：用 <audio> 元素播放自製 WAV，iOS 靜音鍵下也能出聲 ===== */
function makeWav(segs){ // 多段「正弦 + 音高滑動」串起來 = 泡泡聲
  const sr=11025,n=segs.reduce((t,g)=>t+Math.floor(sr*g[2]),0),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
  v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  let ph=0,i=0;
  segs.forEach(([f0,f1,dur,env,vol])=>{const m=Math.floor(sr*dur);
    for(let k=0;k<m;k++,i++){const t=k/sr,f=f0+(f1-f0)*(k/m);ph+=2*Math.PI*f/sr;
      v.setInt16(44+i*2,Math.sin(ph)*Math.exp(-t*env)*vol*32767,true);}});
  let b='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i++)b+=String.fromCharCode(u[i]);
  return 'data:audio/wav;base64,'+btoa(b);
}
const TONES={};
const P=(f0,f1,d=.1,env=28,vol=.8)=>[f0,f1,d,env,vol], G=(d)=>[0,0,d,1,0]; // 泡泡 / 間隔
const DEFS={ // 全部都是單顆泡泡，只差音高；靠近時靠間隔變密
  b1:[P(900,450,.16,22,.7)],
  b2:[P(1050,500,.14,24,.72)],
  b3:[P(1200,560,.13,26,.75)],
  b4:[P(1350,620,.12,28,.78)],
  b5:[P(1500,700,.11,30,.8)],
  b6:[P(1700,800,.10,32,.82)],
  found:[P(1500,900,.18,18)],
};
Object.entries(DEFS).forEach(([k,d])=>{ const a=new Audio(makeWav(d)); a.preload='auto'; a.setAttribute('playsinline',''); TONES[k]=a; });
let audioUnlocked=false;
function unlockAudio(){ // 必須在使用者點擊的當下呼叫
  if(audioUnlocked) return;
  Object.values(TONES).forEach(a=>{ a.volume=0; a.play().then(()=>{a.pause();a.currentTime=0;a.volume=1;}).catch(()=>{a.volume=1;}); });
  audioUnlocked=true;
}
function beep(key='pop'){
  const a=TONES[key]; if(!a) return;
  try{ if(!a.paused && !a.ended) return; a.currentTime=0; a.play().catch(()=>{}); }catch(e){}
}
let alarmTimers=[];
function alarm(){ // 抵達：只震動，不另外出聲
  if(navigator.vibrate) navigator.vibrate([200,80,200]);
}
function stopAllSound(){
  clearTimeout(beepTimer); alarmTimers.forEach(clearTimeout); alarmTimers=[];
  Object.values(TONES).forEach(a=>{ try{ a.pause(); a.currentTime=0; }catch(e){} });
  if(navigator.vibrate) navigator.vibrate(0);
}
const BANDS=[ // [上限公尺, 音檔, 間隔毫秒]，由遠到近
  [1000,'b1',2500],[700,'b2',1600],[400,'b3',1000],[250,'b4',650],[150,'b5',420],[80,'b6',280]];
function bandFor(m){ let b=null; for(const x of BANDS){ if(m<=x[0]) b=x; } return b; }
/* 節拍器：單一計時鏈，GPS 更新只改「目前最近距離」，下一拍才依新距離決定音色與間隔，
   不會因為定位跳動而重啟、疊音 */
let nearestNow=null;
function tick(){
  if(!watching) return;
  const band=bandFor(nearestNow==null?Infinity:nearestNow);
  if(band){ beep(band[1]); beepTimer=setTimeout(tick,band[2]); }
  else beepTimer=setTimeout(tick,1000); // 1 km 外安靜，每秒看一次
}
function updateSound(nearestM){ nearestNow=nearestM; }

/* ===== 朝向 ===== */
let heading=null, gpsHeading=null;
let smoothH=null, shownH=null;
function setHeading(h){ // 低通平滑 + 3 度死區，避免羅盤抖動亂轉
  if(h==null||isNaN(h)) return; h=(h+360)%360;
  if(smoothH==null) smoothH=h;
  else { let d=((h-smoothH+540)%360)-180; smoothH=(smoothH+d*0.15+360)%360; }
  heading=smoothH;
  if(shownH!=null && Math.abs(((smoothH-shownH+540)%360)-180)<3) return;
  shownH=smoothH;
  const el=$('me'); el.classList.remove('nohead');
  // 讓 CSS 過渡走最短路徑：累積角度而不是 0–360 跳
  if(el._last==null) el._acc=smoothH; else el._acc+=((smoothH-el._last+540)%360)-180;
  el._last=smoothH;
  el.style.transform='rotate('+el._acc+'deg)';
}
function onOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==='number') h=e.webkitCompassHeading;      // iOS
  else if(e.absolute===true && typeof e.alpha==='number') h=360-e.alpha;    // Android
  if(h!=null) setHeading(h);
}
async function startHeading(){ // 必須在點擊當下呼叫（iOS 權限）
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted') return;
    }
    window.addEventListener('deviceorientationabsolute',onOrient,true);
    window.addEventListener('deviceorientation',onOrient,true);
  }catch(e){}
}
function stopHeading(){ window.removeEventListener('deviceorientationabsolute',onOrient,true); window.removeEventListener('deviceorientation',onOrient,true); }

/* ===== 畫面 ===== */
const $=id=>document.getElementById(id);
function render(forceOrder=false){
  const blips=$('blips'); blips.innerHTML='';
  const rows=STATUES.map(s=>({...s, d: me?distM(me,s):null, b: me?bearing(me,s):null}));
  rows.sort((a,b)=>{
    if(a.d==null) return a.id-b.id;
    if(found.has(a.id)!==found.has(b.id)) return found.has(a.id)?1:-1;
    return a.d-b.d;
  });

  fitMap();
  /* 雷達點 */
  if(me){
    const R=rangeKm*1000, size=$('screen').clientWidth, half=size/2, rad=half-14;
    rows.forEach(s=>{
      if(found.has(s.id)) return; // 已找到的不再出現在雷達上
      const inRange=s.d<=R;
      let x,y;
      if(inRange&&map&&mapReady){ const pt=map.project([s.lng,s.lat]); x=pt.x; y=pt.y; }
      else { const r=inRange?(s.d/R)*rad:rad; x=half+r*Math.sin(s.b*Math.PI/180); y=half-r*Math.cos(s.b*Math.PI/180); }
      const el=document.createElement('div');
      el.className='blip'+(found.has(s.id)?' found':'')+(inRange?'':' edge')+(s.d<ALERT_M&&!found.has(s.id)?' near':'');
      el.style.left=x+'px'; el.style.top=y+'px';
      if(!inRange) el.style.transform=`rotate(${s.b}deg)`;
      blips.appendChild(el);
      if(inRange && s.id!==21){
        const lb=document.createElement('div'); lb.className='label'+(found.has(s.id)?' found':'');
        lb.textContent=s.name; lb.style.left=x+'px'; lb.style.top=y+'px'; blips.appendChild(lb);
      }
    });
  }

  /* 最近目標 */
  const nearest=rows.find(s=>!found.has(s.id)&&s.d!=null);
  if(nearest){
    $('nearest').hidden=false;
    $('nName').textContent=nearest.name+'　'+nearest.jp;
    $('nWhere').textContent=nearest.place+(nearest.approx?'（約略位置）':'');
    $('nDist').innerHTML=fmt(nearest.d)+'<small>'+dirText(nearest.b)+'</small>';
  } else { $('nearest').hidden=true; }

  /* 清單：只建立一次，之後就地更新文字；重新排序只在頁面靠近頂端時做，避免滑動中跳回頂端 */
  const list=$('list');
  rows.forEach(s=>{
    let li=list.querySelector('li[data-id="'+s.id+'"]');
    if(!li){
      li=document.createElement('li'); li.dataset.id=s.id;
      li.innerHTML=`<div class="no">${s.id}</div>
        <div class="info"><div class="nm">${s.name}<span class="jp">${s.jp}</span></div><div class="pl">${s.place}${s.approx?'（約略）':''}</div></div>
        <div class="d"></div>
        <a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}">導航</a>
        <button class="chk" data-id="${s.id}"></button>`;
      list.appendChild(li);
    }
    li.classList.toggle('found',found.has(s.id));
    li.querySelector('.d').textContent=s.d==null?'':fmt(s.d);
    li.querySelector('.chk').textContent=found.has(s.id)?'已找到':'找到了';
  });
  const wantOrder=rows.map(s=>String(s.id)).join(','), haveOrder=[...list.children].map(li=>li.dataset.id).join(',');
  if(wantOrder!==haveOrder && (window.scrollY<120 || forceOrder)){
    rows.forEach(s=>list.appendChild(list.querySelector('li[data-id="'+s.id+'"]')));
  }
  $('foundCount').textContent=found.size;
  return rows;
}
function dirText(b){ const n=['北','東北','東','東南','南','西南','西','西北']; return ' '+n[Math.round(b/45)%8]; }

/* ===== 定位 ===== */
function onPos(p){
  me={lat:p.coords.latitude,lng:p.coords.longitude};
  $('fixText').textContent='定位精度 ±'+Math.round(p.coords.accuracy)+' m';
  if(heading==null && p.coords.heading!=null && p.coords.speed>1) setHeading(p.coords.heading);
  $('status').className='status'; $('status').textContent='雷達運作中';
  let nearestM=null;
  STATUES.forEach(s=>{
    if(found.has(s.id)) return;
    const d=distM(me,s);
    if(nearestM==null||d<nearestM) nearestM=d;
    if(d<ALERT_M && !alerted.has(s.id)){ alerted.add(s.id); alarm(); toast(`發現 ${s.name}！就在 ${fmt(d)} 內`); }
    if(d>ALERT_M*2) alerted.delete(s.id);
  });
  updateSound(nearestM);
  const now=Date.now(); if(now-lastRender<3000) return; lastRender=now;
  render();
}
function onErr(e){
  $('status').className='status err';
  $('status').textContent= e.code===1?'定位權限被拒絕，請在瀏覽器設定允許位置存取。':'暫時無法取得定位，請確認 GPS 已開啟。';
}
function toggle(){
  if(watching!=null){
    navigator.geolocation.clearWatch(watching); watching=null; stopAllSound(); nearestNow=null; stopHeading();
    $('power').textContent='啟動雷達'; $('power').classList.remove('on');
    $('status').textContent='雷達已停止'; return;
  }
  if(!navigator.geolocation){ onErr({code:2}); return; }
  unlockAudio(); startHeading();
  setTimeout(()=>beep('b2'),150);
  $('power').textContent='停止'; $('power').classList.add('on');
  $('status').textContent='定位中…';
  watching=navigator.geolocation.watchPosition(onPos,onErr,{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
  clearTimeout(beepTimer); beepTimer=setTimeout(tick,1200);
}

/* ===== 事件 ===== */
$('power').addEventListener('click',toggle);
const R_MIN=0.5, R_MAX=30;
function sliderToKm(v){ return R_MIN*Math.pow(R_MAX/R_MIN, v/100); }
function applyRange(){
  const km=sliderToKm(+$('rangeSlider').value);
  rangeKm=km;
  $('scaleText').textContent='範圍 '+(km<1?Math.round(km*1000)+' m':(km<10?km.toFixed(1):Math.round(km))+' km');
  render();
}
$('rangeSlider').addEventListener('input',applyRange);
$('list').addEventListener('click',e=>{
  const b=e.target.closest('.chk'); if(!b) return;
  const id=+b.dataset.id;
  if(found.has(id)) found.delete(id); else { found.add(id); beep('found'); }
  saveHash(); render(true); if(me){ let n=null; STATUES.forEach(s=>{ if(!found.has(s.id)){ const d=distM(me,s); if(n==null||d<n) n=d; } }); updateSound(n); }
  if(found.size===21) toast('全 21 尊制霸！');
});
$('shareBtn').addEventListener('click',async()=>{
  const url=location.href, text=`我在宮古島找到了 ${found.size}/21 尊守護君！`;
  if(navigator.share){ try{ await navigator.share({title:'宮古島守護君雷達',text,url}); return; }catch(e){} }
  try{ await navigator.clipboard.writeText(url); toast('連結已複製'); }catch(e){ prompt('複製這個連結：',url); }
});
$('resetBtn').addEventListener('click',()=>{ if(confirm('清除全部「已找到」紀錄？')){ found.clear(); alerted.clear(); saveHash(); render(); } });
window.addEventListener('resize',render);
let toastT; function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

saveHash(); applyRange();
</script>
</body>
</html>
